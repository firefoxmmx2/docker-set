services:
  maxkb:
    image: registry.fit2cloud.com/maxkb/maxkb
    container_name: maxkb
    restart: always
    ports:
      - "8080:8080"
    volumes:
      # /opt/maxkb 是 MaxKB 官方数据目录（含 PostgreSQL 17 数据与 Redis 数据）
      - ./maxkb:/opt/maxkb
      - ./python-packages:/opt/maxkb/app/sandbox/python-packages
      # 自定义 OpenCode Go 模型供应商（挂载后生效，重启 maxkb 容器加载）
      - ./custom/models_provider/constants/model_provider_constants.py:/opt/maxkb-app/apps/models_provider/constants/model_provider_constants.py
      - ./custom/models_provider/impl/opencode_go_model_provider:/opt/maxkb-app/apps/models_provider/impl/opencode_go_model_provider